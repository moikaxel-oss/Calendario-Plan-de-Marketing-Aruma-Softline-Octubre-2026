<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'DM Sans',system-ui,sans-serif}
button,select,textarea{font-family:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #0B3085;outline-offset:2px}
.app{position:relative;height:100vh;min-height:640px;overflow:hidden;background:var(--bg);color:var(--ink);padding:18px 32px;display:flex;flex-direction:column;gap:12px}
.app[data-brand="aruma"]{--bg:#F29CC9;--ink:#141D5E;--accent:#0B3085;--muted:#4A5178;--doodle:#FFFFFF}
.app[data-brand="softline"]{--bg:#B4B4B4;--ink:#10151C;--accent:#0A5C8F;--muted:#4A5560;--doodle:#E6E6E6}
.doodles{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:.55;color:var(--doodle)}
.bar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px}
.title{display:flex;align-items:center;gap:28px}
.wordmark{font:800 38px/1 'Sora',sans-serif;letter-spacing:-.035em;color:#0B3085}
.app[data-brand="softline"] .wordmark{font:italic 700 40px/1 'Playfair Display',serif;letter-spacing:0;color:#10151C}
.month{font:italic 400 52px/1 'Anton',sans-serif;text-transform:uppercase;color:var(--accent)}
.right{display:flex;align-items:center;gap:14px}
.group{display:flex;align-items:center;gap:6px;padding:5px;background:rgba(255,255,255,.92);border-radius:14px}
.zbtn{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.zlabel{min-width:58px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;font-weight:700;font-size:14px}
.brandbtn{height:52px;padding:0 28px;border-radius:16px;border:2px solid transparent;background:rgba(255,255,255,.92);cursor:pointer}
.brandbtn.aruma{font:800 22px 'Sora',sans-serif;color:#0B3085}
.brandbtn.softline{font:italic 700 24px 'Playfair Display',serif;color:#0A5C8F}
.brandbtn.aruma[aria-pressed="true"]{background:#0B3085;color:#fff}
.brandbtn.softline[aria-pressed="true"]{background:#0A5C8F;color:#fff}
.tab{height:42px;padding:0 20px;border-radius:10px;border:0;background:transparent;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:#fff}
.months{display:flex;gap:8px}
.mbtn{min-width:56px;height:40px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,.92);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer}
.mbtn[aria-pressed="true"]{background:var(--accent);color:#fff}
.stat{display:inline-flex;align-items:baseline;gap:6px;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:500}
.stat b{font-size:20px;line-height:1;font-weight:700}
.stat.s0{background:#0B3085;color:#fff}.stat.s1{background:#FFF1A6;color:#4A3C00}.stat.s2{background:#C8EED0;color:#0F4A21}
.total{font-size:13px;color:#3A4060;padding:0 6px}
.calbox{position:relative;flex:1;min-height:0}
.calscroll{position:absolute;left:0;top:0;right:0;bottom:0;overflow:auto;overscroll-behavior:contain;border-radius:14px}
.wrap{display:flex;flex-direction:column;gap:1px;background:#1A1A2E;border-radius:14px}
.wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}
.wd span{background:#38B6FF;color:#0B1B3A;font-weight:700;font-size:13px;letter-spacing:.06em;padding:8px 0;text-align:center}
.wd span:first-child{border-top-left-radius:14px}.wd span:last-child{border-top-right-radius:14px}
.grid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}
.cell{position:relative;background:#fff;padding:6px 6px 8px;min-height:96px;display:flex;flex-direction:column;gap:5px}
.cell.we{background:#EEEDE8}.cell.blank{background:#D9D8D2}.cell.open{z-index:20}
.dayrow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.day{height:26px;display:inline-flex;align-items:center;font-weight:700;font-size:15px;color:var(--ink)}
.day.today{min-width:26px;padding:0 6px;justify-content:center;border-radius:999px;background:var(--accent);color:#fff;font-size:13px}
.add{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid #C3C7DA;background:#fff;color:#4A5178;cursor:pointer;padding:0}
.list{display:flex;flex-direction:column;gap:5px}
.card{position:relative;z-index:1;border:1px solid #CDD2E6;background:#fff;border-radius:8px;padding:5px 5px 4px 6px;display:flex;flex-direction:column;gap:3px}
.card.s1{background:#FFF1A6;border-color:#E3C63D}.card.s2{background:#C8EED0;border-color:#58B873}.card.open{z-index:30}
.del{position:absolute;top:4px;right:4px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(20,29,94,.18);border-radius:999px;background:#fff;color:#3A4060;cursor:pointer;padding:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding-right:26px}
.fmt{flex:none;max-width:88px;height:22px;border-radius:999px;padding:0 6px;cursor:pointer;font-weight:700;font-size:11px;border:1px dashed #A5ACC8;background:#fff;color:#4A5178}
.fmt.f-R{border:0;background:#FFDDEC;color:#8F1250}.fmt.f-C{border:0;background:#E1E1FF;color:#2A2A96}.fmt.f-H{border:0;background:#CFF1ED;color:#075650}
.stwrap{position:relative;flex:none}
.stbtn{height:22px;display:inline-flex;align-items:center;gap:5px;padding:0 7px 0 6px;border-radius:999px;border:1px solid rgba(20,29,94,.2);background:rgba(255,255,255,.9);color:#262B4A;font-weight:700;font-size:11px;cursor:pointer}
.dot{width:9px;height:9px;border-radius:999px;flex:none;background:#fff;border:1.5px solid #8C93B3}
.dot.s1{background:#FFD84D;border-color:#C9A825}.dot.s2{background:#47B866;border-color:#2E8A48}
.menu{position:absolute;top:26px;left:0;z-index:40;min-width:140px;background:#fff;border:1px solid #D6D9E8;border-radius:10px;box-shadow:0 8px 24px rgba(11,27,58,.18);padding:4px;display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:0;border-radius:7px;text-align:left;cursor:pointer;color:#171A2B;font-weight:500;font-size:13px;background:transparent}
.opt:hover{background:#F3F4FA}.opt[aria-current="true"]{font-weight:700;background:#EEF0FA}
.txt{width:100%;min-height:20px;resize:none;overflow:hidden;border:0;border-radius:5px;padding:2px 3px;font:500 12.5px/1.3 'DM Sans',sans-serif;color:#171A2B;background:transparent;field-sizing:content}
.txt::placeholder{color:#6B7194}
.txt:focus{background:#fff;outline:2px solid #0B3085;outline-offset:0}
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:100;display:none;align-items:center;gap:16px;background:#0B1B3A;color:#fff;border-radius:12px;padding:10px 10px 10px 18px;box-shadow:0 10px 30px rgba(11,27,58,.3);font-size:14px}
.toast.show{display:flex}
.toast button{height:34px;padding:0 14px;border:0;border-radius:8px;background:#fff;color:#0B1B3A;font-weight:700;font-size:13px;cursor:pointer}
@media (max-width:1300px){.bar{flex-wrap:wrap}.app{overflow:auto}}
.login{position:absolute;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:var(--bg)}
.login.show{display:flex}
.login form{background:#fff;border-radius:18px;padding:28px;width:min(380px,92vw);display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(11,27,58,.2)}
.login h1{margin:0;font:800 28px 'Sora',sans-serif;color:#0B3085;letter-spacing:-.03em}
.login p{margin:0;font-size:14px;color:#4A5178}
.login input{height:44px;border:1px solid #C3C7DA;border-radius:10px;padding:0 12px;font:500 15px 'DM Sans',sans-serif}
.login button{height:44px;border:0;border-radius:10px;background:#0B3085;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.login .err{color:#B3261E;font-size:13px;min-height:16px}
.syncerr{display:none;background:#B3261E;color:#fff;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700}
.syncerr.show{display:inline-block}
.hist{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);z-index:90;background:#fff;color:#171A2B;box-shadow:-10px 0 30px rgba(11,27,58,.25);display:none;flex-direction:column}
.hist.show{display:flex}
.hist header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #E3E5F0;font-weight:700;font-size:16px}
.hist ol{list-style:none;margin:0;padding:6px 0;overflow:auto;flex:1}
.hist li{padding:10px 18px;border-bottom:1px solid #F0F1F7;font-size:13px;line-height:1.4}
.hist .sub{display:block;color:#4A5178;font-size:12px}
.hist .when{display:block;color:#6B7194;font-size:12px;margin-top:2px}
.hist .go{all:unset;cursor:pointer;text-decoration:underline}
.hist .empty{padding:24px 18px;color:#6B7194;font-size:14px}
[hidden]{display:none!important}

const MONTH_NAMES = { 6: 'Junio', 7: 'Julio', 8: 'Agosto', 9: 'Septiembre', 10: 'Octubre', 11: 'Noviembre', 12: 'Diciembre' };
const MONTH_SHORT = { 6: 'Jun', 7: 'Jul', 8: 'Ago', 9: 'Sep', 10: 'Oct', 11: 'Nov', 12: 'Dic' };
const ST_NAMES = ['Por hacer', 'Diseñado', 'Programado'];
const FMT_NAMES = { '': 'sin formato', R: 'Reel', C: 'Carrusel', H: 'Historia' };
const BRAND_NAMES = { aruma: 'Aruma', softline: 'Soft Line' };
const CH_NAMES = { org: 'orgánico', ads: 'Meta Ads' };

function seed() {
  const out = {};
  Object.keys(DATA).forEach((k) => { out[k] = DATA[k].map((r, i) => ({ id: k + ':' + i, d: r[0], f: r[1], s: r[2], t: r[3] })); });
  return out;
}
let entries = {};
let log = [];
const nowM = new Date().getMonth() + 1;
const S = { brand: 'aruma', channel: 'org', month: (nowM >= 6 && nowM <= 12) ? nowM : 6, openId: null, zoom: 1, undo: null };

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const key = () => S.brand + '|' + S.channel + '|' + S.month;
const list = () => (entries[key()] || []).filter((e) => e.f !== 'N');

// ---------- Capa de datos ----------
const rowKey = (r) => r.brand + '|' + r.channel + '|' + r.month;
const fromRow = (r) => ({ id: r.id, d: r.day, f: r.format || '', s: r.status, t: r.text || '' });
const toRow = (k, e) => { const [brand, channel, month] = k.split('|'); return { id: e.id, brand, channel, year: YEAR, month: Number(month), day: e.d, format: e.f || null, status: e.s, text: e.t || '' }; };

function saveLocal() { if (!REMOTE) { try { localStorage.setItem(STORE, JSON.stringify(entries)); } catch (e) {} } }
function showError(msg) { const el = $('syncErr'); el.textContent = msg ? 'No se pudo guardar: ' + msg : ''; el.classList.toggle('show', Boolean(msg)); }
function remote(op) { if (REMOTE) op.then(({ error }) => showError(error ? error.message : ''), (e) => showError(e.message)); }

const pending = new Map(); // id -> timer del texto que se está tipeando
function placeRow(r) {
  const k = rowKey(r); const next = fromRow(r);
  for (const kk of Object.keys(entries)) { if (kk !== k) entries[kk] = entries[kk].filter((e) => e.id !== r.id); }
  const arr = entries[k] || (entries[k] = []);
  const cur = arr.find((e) => e.id === r.id);
  if (!cur) { arr.push(next); return true; }
  if (pending.has(r.id)) next.t = cur.t; // el que escribe conserva su texto hasta que se guarde
  if (cur.d === next.d && cur.f === next.f && cur.s === next.s && cur.t === next.t) return false;
  Object.assign(cur, next); return true;
}
function dropRow(id) {
  let hit = false;
  for (const k of Object.keys(entries)) { const n = entries[k].length; entries[k] = entries[k].filter((e) => e.id !== id); if (entries[k].length !== n) hit = true; }
  return hit;
}

async function loadRemote() {
  const [p, l] = await Promise.all([
    sb.from('cal_posts').select('id, brand, channel, month, day, format, status, text').eq('year', YEAR).order('created_at').limit(5000),
    sb.from('cal_log').select('id, at, user_name, action, brand, channel, month, day, text, changes').order('at', { ascending: false }).limit(LOG_LIMIT),
  ]);
  if (p.error) { showError(p.error.message); return; }
  entries = {};
  p.data.forEach((r) => { (entries[rowKey(r)] || (entries[rowKey(r)] = [])).push(fromRow(r)); });
  log = l.error ? [] : l.data;
  render(); renderHist();
}
function subscribeRemote() {
  sb.channel('calendar')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'cal_posts' }, (pl) => {
      const changed = pl.eventType === 'DELETE' ? dropRow(pl.old.id) : placeRow(pl.new);
      if (changed) renderGrid();
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'cal_log' }, (pl) => {
      log = [pl.new, ...log].slice(0, LOG_LIMIT); renderHist();
    })
    // al reconectar se pudo perder algo: se vuelve a cargar todo
    .subscribe((status) => { if (status === 'SUBSCRIBED') loadRemote(); });
}

function findEntry(id) { return (entries[key()] || []).find((e) => e.id === id); }
function addEntry(d) {
  const k = key();
  const e = { id: crypto.randomUUID(), d: d, f: '', s: 0, t: '' };
  entries[k] = (entries[k] || []).concat([e]);
  saveLocal(); renderGrid();
  if (REMOTE) remote(sb.from('cal_posts').insert(toRow(k, e)));
}
function patchEntry(e, patch) {
  Object.assign(e, patch); saveLocal();
  if (!REMOTE) return;
  const row = {};
  if ('f' in patch) row.format = patch.f || null;
  if ('s' in patch) row.status = patch.s;
  if ('d' in patch) row.day = patch.d;
  remote(sb.from('cal_posts').update(row).eq('id', e.id));
}
// El texto se guarda al dejar de tipear, así el historial no se llena de letras sueltas
function saveText(e) {
  clearTimeout(pending.get(e.id));
  pending.set(e.id, setTimeout(() => { pending.delete(e.id); remote(sb.from('cal_posts').update({ text: e.t }).eq('id', e.id)); }, 900));
}
function flushPending() {
  if (!REMOTE) return;
  pending.forEach((timer, id) => {
    clearTimeout(timer);
    const e = Object.values(entries).flat().find((x) => x.id === id);
    if (e) remote(sb.from('cal_posts').update({ text: e.t }).eq('id', id));
  });
  pending.clear();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushPending(); });
window.addEventListener('pagehide', flushPending);

// ---------- Dibujo ----------
function renderTop() {
  $('app').dataset.brand = S.brand;
  $('wordmark').textContent = BRAND_NAMES[S.brand];
  $('monthTitle').textContent = MONTH_NAMES[S.month];
  document.querySelectorAll('[data-brand-btn]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.brandBtn === S.brand)));
  document.querySelectorAll('[data-channel]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.channel === S.channel)));
  $('months').innerHTML = [6, 7, 8, 9, 10, 11, 12].map((m) => '<button class="mbtn" type="button" data-month="' + m + '" aria-pressed="' + (m === S.month) + '">' + MONTH_SHORT[m] + '</button>').join('');
  renderCounts();
}
function renderCounts() {
  const l = list(); const c = [0, 0, 0];
  l.forEach((e) => { c[e.s] += 1; });
  $('c0').textContent = c[0]; $('c1').textContent = c[1]; $('c2').textContent = c[2]; $('cT').textContent = l.length;
}
function cardHTML(e) {
  const open = S.openId === e.id;
  const opts = ST_NAMES.map((n, i) => '<button class="opt" type="button" data-pick="' + i + '" data-id="' + esc(e.id) + '" aria-current="' + (e.s === i) + '"><span class="dot s' + i + '"></span>' + n + '</button>').join('');
  return '<div class="card s' + e.s + (open ? ' open' : '') + '">' +
    '<button class="del" type="button" data-del="' + esc(e.id) + '" aria-label="Eliminar este contenido" title="Eliminar"><svg width="10" height="10" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>' +
    '<div class="row">' +
      '<select class="fmt f-' + (e.f || '') + '" data-fmt="' + esc(e.id) + '" aria-label="Formato del contenido">' +
        '<option value=""' + (e.f ? '' : ' selected') + '>Formato</option>' +
        '<option value="R"' + (e.f === 'R' ? ' selected' : '') + '>Reel</option>' +
        '<option value="C"' + (e.f === 'C' ? ' selected' : '') + '>Carrusel</option>' +
        '<option value="H"' + (e.f === 'H' ? ' selected' : '') + '>Historia</option>' +
      '</select>' +
      '<div class="stwrap"><button class="stbtn" type="button" data-st="' + esc(e.id) + '" aria-haspopup="true" aria-expanded="' + open + '" aria-label="Estado: ' + ST_NAMES[e.s] + '"><span class="dot s' + e.s + '"></span>Estado<svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5l3 3 3-3"/></svg></button>' +
      (open ? '<div class="menu">' + opts + '</div>' : '') + '</div>' +
    '</div>' +
    '<textarea class="txt" rows="1" data-txt="' + esc(e.id) + '" aria-label="De qué trata el contenido" placeholder="¿De qué trata?">' + esc(e.t || '') + '</textarea>' +
  '</div>';
}
function renderGrid() {
  // Si alguien escribe y llega un cambio de otra persona, no se le corta el cursor
  const ae = document.activeElement;
  const keep = ae && ae.matches && ae.matches('textarea[data-txt]') ? { id: ae.dataset.txt, a: ae.selectionStart, b: ae.selectionEnd } : null;
  const m = S.month;
  const lead = (new Date(YEAR, m - 1, 1).getDay() + 6) % 7;
  const dim = new Date(YEAR, m, 0).getDate();
  const total = Math.ceil((lead + dim) / 7) * 7;
  const now = new Date();
  const today = (now.getFullYear() === YEAR && now.getMonth() + 1 === m) ? now.getDate() : -1;
  const l = list();
  let h = '';
  for (let i = 0; i < total; i++) {
    const d = i - lead + 1;
    if (d < 1 || d > dim) { h += '<div class="cell blank"></div>'; continue; }
    const es = l.filter((e) => e.d === d);
    const open = es.some((e) => e.id === S.openId);
    h += '<div class="cell' + ((i % 7) >= 5 ? ' we' : '') + (open ? ' open' : '') + '">' +
      '<div class="dayrow"><span class="day' + (d === today ? ' today' : '') + '">' + d + '</span>' +
      '<button class="add" type="button" data-add="' + d + '" aria-label="Agregar contenido al día ' + d + '" title="Agregar contenido"><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg></button></div>' +
      '<div class="list">' + es.map(cardHTML).join('') + '</div></div>';
  }
  const g = $('grid');
  g.style.gridTemplateRows = 'repeat(' + (total / 7) + ', auto)';
  g.innerHTML = h;
  g.querySelectorAll('.txt').forEach(autosize);
  if (keep) {
    const t = g.querySelector('textarea[data-txt="' + CSS.escape(keep.id) + '"]');
    if (t) { t.focus(); try { t.setSelectionRange(keep.a, keep.b); } catch (e) {} }
  }
  renderCounts();
}
function autosize(t) { if (window.CSS && CSS.supports && CSS.supports('field-sizing', 'content')) return; t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
function render() { renderTop(); renderGrid(); }

// ---------- Historial ----------
function histText(e) {
  if (e.action === 'insert') return 'agregó un contenido';
  if (e.action === 'delete') return 'eliminó un contenido';
  const c = e.changes || {};
  return 'cambió ' + Object.keys(c).map((f) => {
    const [a, b] = c[f];
    if (f === 'status') return 'estado: ' + ST_NAMES[a] + ' → ' + ST_NAMES[b];
    if (f === 'format') return 'formato: ' + FMT_NAMES[a || ''] + ' → ' + FMT_NAMES[b || ''];
    if (f === 'day') return 'día: ' + a + ' → ' + b;
    return 'el texto';
  }).join(' · ');
}
function renderHist() {
  const ol = $('histList');
  if (!log.length) { ol.innerHTML = '<li class="empty">Todavía no hay cambios registrados.</li>'; return; }
  ol.innerHTML = log.map((e, i) => {
    const txt = e.text ? (e.text.length > 70 ? e.text.slice(0, 70) + '…' : e.text) : '';
    const when = new Date(e.at).toLocaleString('es-AR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    return '<li><b>' + esc(e.user_name || 'Alguien del equipo') + '</b> ' + esc(histText(e)) +
      (txt ? '<span class="sub">“' + esc(txt) + '”</span>' : '') +
      '<span class="sub"><button class="go" type="button" data-go="' + i + '">' + esc(BRAND_NAMES[e.brand] + ' · ' + CH_NAMES[e.channel] + ' · ' + e.day + ' de ' + (MONTH_NAMES[e.month] || '').toLowerCase()) + '</button></span>' +
      '<span class="when">' + esc(when) + '</span></li>';
  }).join('');
}
$('histBtn').addEventListener('click', () => { const s = !$('hist').classList.contains('show'); $('hist').classList.toggle('show', s); $('histBtn').setAttribute('aria-pressed', String(s)); });
$('histClose').addEventListener('click', () => { $('hist').classList.remove('show'); $('histBtn').setAttribute('aria-pressed', 'false'); });
$('histList').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-go]'); if (!b) return;
  const e = log[Number(b.dataset.go)]; if (!e) return;
  S.brand = e.brand; S.channel = e.channel; S.month = e.month; S.openId = null; render();
});

// ---------- Eliminar / deshacer ----------
let undoTimer;
function removeEntry(id) {
  const k = key(); const arr = entries[k] || []; const idx = arr.findIndex((e) => e.id === id);
  if (idx < 0) return;
  const item = arr[idx];
  clearTimeout(pending.get(id)); pending.delete(id);
  entries[k] = arr.filter((e) => e.id !== id);
  S.undo = { k: k, idx: idx, item: item };
  saveLocal(); renderGrid();
  if (REMOTE) remote(sb.from('cal_posts').delete().eq('id', id));
  $('toastText').textContent = 'Eliminaste “' + ((item.t || 'contenido sin texto').slice(0, 40)) + '” del ' + item.d;
  $('toast').classList.add('show');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { $('toast').classList.remove('show'); S.undo = null; }, 6000);
}
$('undoBtn').addEventListener('click', () => {
  const u = S.undo; if (!u) return;
  const arr = (entries[u.k] || []).slice(); arr.splice(Math.min(u.idx, arr.length), 0, u.item);
  entries[u.k] = arr; S.undo = null; clearTimeout(undoTimer); $('toast').classList.remove('show');
  saveLocal(); renderGrid();
  if (REMOTE) remote(sb.from('cal_posts').insert(toRow(u.k, u.item))); // vuelve con el mismo id
});

// ---------- Controles ----------
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.brandBtn) { S.brand = t.dataset.brandBtn; S.openId = null; render(); }
  else if (t.dataset.channel) { S.channel = t.dataset.channel; S.openId = null; render(); }
  else if (t.dataset.month) { S.month = Number(t.dataset.month); S.openId = null; render(); }
});
const grid = $('grid');
grid.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.add) addEntry(Number(b.dataset.add));
  else if (b.dataset.del) removeEntry(b.dataset.del);
  else if (b.dataset.st) { S.openId = S.openId === b.dataset.st ? null : b.dataset.st; renderGrid(); }
  else if (b.dataset.pick !== undefined) { const e = findEntry(b.dataset.id); if (e) patchEntry(e, { s: Number(b.dataset.pick) }); S.openId = null; renderGrid(); }
});
grid.addEventListener('change', (ev) => {
  const s = ev.target.closest('select[data-fmt]'); if (!s) return;
  const e = findEntry(s.dataset.fmt); if (e) { patchEntry(e, { f: s.value }); renderGrid(); }
});
grid.addEventListener('input', (ev) => {
  const t = ev.target.closest('textarea[data-txt]'); if (!t) return;
  const e = findEntry(t.dataset.txt); if (e) { e.t = t.value; saveLocal(); if (REMOTE) saveText(e); autosize(t); }
});
document.addEventListener('mousedown', (ev) => {
  if (!S.openId) return;
  if (ev.target.closest('.menu') || ev.target.closest('[data-st]')) return;
  S.openId = null; renderGrid();
});

// ---------- Zoom (botones + pellizco del trackpad) ----------
const scroll = $('scroll'); const wrap = $('wrap'); const box = $('calbox');
function sizeWrap() { wrap.style.width = Math.floor(box.clientWidth) + 'px'; wrap.style.minHeight = Math.floor(box.clientHeight) + 'px'; }
function applyZoom() { wrap.style.zoom = S.zoom; $('zReset').textContent = Math.round(S.zoom * 100) + '%'; }
const clampZ = (z) => Math.max(0.5, Math.min(3, Math.round(z * 100) / 100));
function zoomAt(z, ox, oy) {
  const nz = clampZ(z); const old = S.zoom; if (nz === old) return;
  const cx = (scroll.scrollLeft + ox) / old, cy = (scroll.scrollTop + oy) / old;
  S.zoom = nz; applyZoom();
  scroll.scrollLeft = cx * nz - ox; scroll.scrollTop = cy * nz - oy;
}
function point(ev) {
  const r = scroll.getBoundingClientRect();
  return { x: Math.max(0, Math.min(r.width, ev.clientX - r.left)), y: Math.max(0, Math.min(r.height, ev.clientY - r.top)) };
}
$('zIn').addEventListener('click', () => zoomAt(S.zoom + 0.1, 0, 0));
$('zOut').addEventListener('click', () => zoomAt(S.zoom - 0.1, 0, 0));
$('zReset').addEventListener('click', () => zoomAt(1, 0, 0));
document.addEventListener('wheel', (ev) => {
  if (!ev.ctrlKey) return;
  ev.preventDefault();
  const p = point(ev); zoomAt(S.zoom * Math.exp(-ev.deltaY * 0.012), p.x, p.y);
}, { passive: false });
let gz = 1;
document.addEventListener('gesturestart', (ev) => { ev.preventDefault(); gz = S.zoom; }, { passive: false });
document.addEventListener('gesturechange', (ev) => { ev.preventDefault(); const p = point(ev); zoomAt(gz * ev.scale, p.x, p.y); }, { passive: false });
document.addEventListener('gestureend', (ev) => ev.preventDefault(), { passive: false });
if (window.ResizeObserver) new ResizeObserver(sizeWrap).observe(box); else window.addEventListener('resize', sizeWrap);

// ---------- Arranque ----------
sizeWrap(); applyZoom();

async function startRemote() {
  $('login').classList.remove('show');
  $('teamGroup').hidden = false;
  await loadRemote();
  subscribeRemote();
}

if (!REMOTE) {
  try { const raw = localStorage.getItem(STORE); entries = raw ? JSON.parse(raw) : seed(); } catch (e) { entries = seed(); }
  render();
} else {
  render(); // marco vacío detrás del login
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  sb = createClient(cfg.supabaseUrl, cfg.supabaseKey);
  const { data } = await sb.auth.getSession();
  if (data.session) startRemote(); else $('login').classList.add('show');

  $('loginForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    $('loginErr').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
    if (error) { $('loginErr').textContent = 'Mail o contraseña incorrectos.'; return; }
    $('pass').value = '';
    startRemote();
  });
  $('signOut').addEventListener('click', async () => {
    flushPending();
    await sb.auth.signOut();
    location.reload();
  });
}
